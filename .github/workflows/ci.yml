name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated tokens are up to date (AC-002-1)
        run: npm run tokens -- --check
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests (AC-001-18 budget is 60 s)
        run: npm test
        timeout-minutes: 1
