# AC-002-16: every component with Large text at 360 dp, in light and dark.
# Needs a build with the component gallery (a debug build). Ids come from Compose testTags exposed as resource ids (spec 001/002 re-plan).
appId: com.vmleroy.tutora.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 15000
- openLink: tutora://dev/components
- extendedWaitUntil:
    visible:
      id: gallery-ground
    timeout: 10000
- tapOn: 'Grande|Large'
- scrollUntilVisible:
    element:
      id: gallery-Icon
    direction: DOWN
    centerElement: true
- takeScreenshot: .maestro/screenshots/large-light-Icon
- scrollUntilVisible:
    element:
      id: gallery-Button
    direction: DOWN
    centerElement: true
- takeScreenshot: .maestro/screenshots/large-light-Button
