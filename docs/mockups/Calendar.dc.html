<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sincronizar calendário</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E5E4E}a:hover{color:#234A3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F0; font-family: Nunito, system-ui, sans-serif; color: #1F2A2E; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 10px; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
    <a href="Settings.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 22px; background: #F3EEE2; color: #1F2A2E; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 800">Calendário</h1>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 16px; overflow: hidden">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 12px">
      <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px">
        <span style="font-size: 16px; font-weight: 800">Enviar aulas para o calendário</span>
        <span style="font-size: 13px; color: #5C6A70">{{statusLine}}</span>
      </div>
      <button onClick="{{toggleSync}}" aria-pressed="{{on}}" aria-label="Enviar aulas para o calendário" style="width: 52px; height: 32px; border-radius: 16px; border: none; background: {{syncTrack}}; padding: 3px; display: flex; justify-content: {{syncAlign}}; flex-shrink: 0; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span></button>
    </div>

    <sc-if value="{{on}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 800; color: #5C6A70">Em qual calendário?</span>
        <div role="radiogroup" aria-label="Calendário de destino" style="background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column">
          <sc-for list="{{calendars}}" as="c" hint-placeholder-count="3">
            <button role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="min-height: 60px; border: none; border-bottom: 1px solid #F0EADC; background: transparent; padding: 10px 16px; display: flex; align-items: center; gap: 12px; font-family: Nunito, system-ui, sans-serif; color: #1F2A2E; text-align: left; cursor: pointer">
              <span style="width: 36px; height: 36px; border-radius: 10px; background: {{c.tint}}; color: {{c.color}}; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{c.letter}}</span>
              <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 800">{{c.name}}</span><span style="font-size: 12px; color: #5C6A70">{{c.sub}}</span></span>
              <span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{c.ring}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{c.dot}}"></span></span>
            </button>
          </sc-for>
        </div>

        <div style="background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column; margin-top: 6px">
          <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; gap: 12px; border-bottom: 1px solid #F0EADC">
              <div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{o.label}}</span><span style="font-size: 12px; color: #5C6A70">{{o.sub}}</span></div>
              <button onClick="{{o.toggle}}" aria-pressed="{{o.on}}" aria-label="{{o.label}}" style="width: 52px; height: 32px; border-radius: 16px; border: none; background: {{o.track}}; padding: 3px; display: flex; justify-content: {{o.align}}; flex-shrink: 0; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span></button>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <div style="background: #E3ECF8; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; color: #24497E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.5"></path></svg>
      <span style="font-size: 13px; line-height: 1.4">As aulas vão para a agenda do celular. O Google Agenda ou o Outlook levam para a nuvem sozinhos, então a Tutora continua sem servidor.</span>
    </div>

    <button style="height: 48px; border-radius: 14px; border: 1px solid #DCD5C6; background: #FFFFFF; color: #1F2A2E; font-family: Nunito, system-ui, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>Exportar agenda como .ics
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#2E5E4E","options":["#2E5E4E","#1F4E5F","#3D6FB4"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const primary = this.props.primary ?? '#2E5E4E';
    const on = s.on ?? true;
    const cal = s.cal ?? 0;
    const busy = s.busy ?? true;
    const money = s.money ?? false;
    const CALS = [
      { name: 'Google Agenda', sub: 'Conta Google do celular', letter: 'G', color: '#1F5FBF', tint: '#E3ECF8' },
      { name: 'Outlook', sub: 'Conta Microsoft do celular', letter: 'O', color: '#0F5A8A', tint: '#DDEEF7' },
      { name: 'Só neste aparelho', sub: 'Calendário local, sem conta', letter: 'A', color: '#2E5E4E', tint: '#E1EEE8' }
    ];
    const sw = (v) => ({ track: v ? primary : '#CFC8B8', align: v ? 'flex-end' : 'flex-start' });
    return {
      on: on,
      statusLine: on ? 'Atualizado agora · 24 aulas nas próximas 8 semanas' : 'Desligado',
      syncTrack: sw(on).track,
      syncAlign: sw(on).align,
      toggleSync: () => this.setState({ on: !on }),
      calendars: CALS.map((c, i) => ({
        name: c.name, sub: c.sub, letter: c.letter, color: c.color, tint: c.tint,
        on: i === cal,
        ring: i === cal ? primary : '#CFC8B8',
        dot: i === cal ? primary : 'transparent',
        pick: () => this.setState({ cal: i })
      })),
      options: [
        { label: 'Mostrar outros compromissos', sub: 'Exibe horários ocupados na Agenda da Tutora', on: busy, track: sw(busy).track, align: sw(busy).align, toggle: () => this.setState({ busy: !busy }) },
        { label: 'Incluir valor na descrição', sub: 'Desligado: o evento mostra só aluno e matéria', on: money, track: sw(money).track, align: sw(money).align, toggle: () => this.setState({ money: !money }) }
      ]
    };
  }
}
</script>
</body>
</html>
