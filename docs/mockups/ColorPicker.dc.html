<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cores personalizadas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E5E4E}a:hover{color:#234A3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F0; font-family: Nunito, system-ui, sans-serif; color: #1F2A2E; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 8px; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
    <a href="Theme.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 22px; background: #F3EEE2; color: #1F2A2E; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 800; flex-grow: 1">Suas cores</h1>
    <button onClick="{{resetAll}}" style="border: none; background: transparent; color: #2E5E4E; font-family: Nunito, system-ui, sans-serif; font-size: 14px; font-weight: 800; padding: 10px 0; cursor: pointer">Restaurar</button>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 12px; overflow: hidden">
    <section aria-label="Pré-visualização" style="border-radius: 18px; overflow: hidden; background: {{c.background}}; border: 1px solid #E4DDCD; display: flex; flex-direction: column">
      <div style="background: {{c.header}}; color: {{headerText}}; padding: 10px 14px 24px">
        <span style="font-size: 15px; font-weight: 800">Boa tarde, Victor</span>
      </div>
      <div style="margin: -14px 10px 0; background: {{c.cards}}; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 3px 10px rgba(0,0,0,0.10)">
        <span style="font-size: 12px; font-weight: 700; color: #5C6A70">Ganho hoje</span>
        <span style="font-size: 20px; font-weight: 800; color: {{c.money}}; font-variant-numeric: tabular-nums">R$ 240,00</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px">
        <span style="height: 36px; border-radius: 10px; background: {{c.primaryBtn}}; color: {{primaryText}}; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">Salvar aula</span>
        <span style="height: 36px; border-radius: 10px; background: {{c.accentBtn}}; color: {{accentText}}; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">Iniciar aula</span>
      </div>
      <div style="background: #FFFFFF; border-top: 1px solid #ECE6D8; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 0">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 800; color: {{c.nav}}"><span style="width: 20px; height: 4px; border-radius: 2px; background: {{c.nav}}"></span>Hoje</span>
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: #5C6A70"><span style="width: 20px; height: 4px"></span>Agenda</span>
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: #5C6A70"><span style="width: 20px; height: 4px"></span>Alunos</span>
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: #5C6A70"><span style="width: 20px; height: 4px"></span>Ganhos</span>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 800; color: #5C6A70">Escolha o que pintar</span>
      <div role="radiogroup" aria-label="Elemento" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{elements}}" as="e" hint-placeholder-count="7">
          <button role="radio" aria-checked="{{e.on}}" onClick="{{e.pick}}" style="height: 40px; border-radius: 12px; border: {{e.border}}; background: #FFFFFF; padding: 0 10px; display: flex; align-items: center; gap: 8px; font-family: Nunito, system-ui, sans-serif; color: #1F2A2E; cursor: pointer; box-sizing: border-box">
            <span style="width: 20px; height: 20px; border-radius: 6px; background: {{e.color}}; border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0"></span>
            <span style="font-size: 13px; font-weight: 700; white-space: nowrap">{{e.label}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <section aria-label="Editor de cor" style="background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 48px; height: 48px; border-radius: 14px; background: {{hex}}; border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0"></span>
        <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px">
          <label for="hex" style="font-size: 12px; font-weight: 700; color: #5C6A70">{{selLabel}} · código HEX</label>
          <input id="hex" type="text" value="{{hexInput}}" onChange="{{onHex}}" maxLength="7" style="height: 34px; border: 1px solid #E4DDCD; border-radius: 10px; padding: 0 10px; font-family: ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 700; color: #1F2A2E; text-transform: uppercase; box-sizing: border-box; width: 120px">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <label for="hue" style="font-size: 12px; font-weight: 700; color: #5C6A70">Matiz</label>
        <input id="hue" type="range" min="0" max="359" value="{{h}}" onChange="{{onH}}" style="width: 100%; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #E53935, #FDD835, #43A047, #00ACC1, #1E88E5, #8E24AA, #E53935); accent-color: #1F2A2E; margin: 0">
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <label for="sat" style="font-size: 12px; font-weight: 700; color: #5C6A70">Intensidade</label>
        <input id="sat" type="range" min="0" max="100" value="{{s}}" onChange="{{onS}}" style="width: 100%; height: 14px; border-radius: 7px; background: linear-gradient(90deg, {{satFrom}}, {{satTo}}); accent-color: #1F2A2E; margin: 0">
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <label for="lig" style="font-size: 12px; font-weight: 700; color: #5C6A70">Brilho</label>
        <input id="lig" type="range" min="5" max="97" value="{{l}}" onChange="{{onL}}" style="width: 100%; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #000000, {{ligMid}}, #FFFFFF); accent-color: #1F2A2E; margin: 0">
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding-top: 2px">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: {{contrastDot}}; flex-shrink: 0"></span>
        <span style="font-size: 12px; font-weight: 700; color: #3E4A4F">{{contrastText}}</span>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const DEFAULTS = { header: '#2E5E4E', primaryBtn: '#2E5E4E', accentBtn: '#F2B33D', money: '#2E5E4E', background: '#FAF7F0', cards: '#FFFFFF', nav: '#2E5E4E' };
    const LABELS = [['header', 'Cabeçalho'], ['primaryBtn', 'Botões principais'], ['accentBtn', 'Botão de destaque'], ['money', 'Valores (R$)'], ['background', 'Fundo'], ['cards', 'Cartões'], ['nav', 'Menu ativo']];
    const c = Object.assign({}, DEFAULTS, st.colors || {});
    const sel = st.sel ?? 'accentBtn';
    const hex = c[sel];
    const toRgb = (x) => { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const toHsl = (x) => {
      let [r, g, b] = toRgb(x).map((v) => v / 255);
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
      let h = 0; const l = (mx + mn) / 2;
      const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
      if (d) { h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
      return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
    };
    const fromHsl = (h, s, l) => {
      s /= 100; l /= 100;
      const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
      const f = (n) => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0');
      return ('#' + f(0) + f(8) + f(4)).toUpperCase();
    };
    const lum = (x) => { const v = toRgb(x).map((u) => { u /= 255; return u <= 0.03928 ? u / 12.92 : Math.pow((u + 0.055) / 1.055, 2.4); }); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
    const ratio = (a, b) => { const A = lum(a), B = lum(b); return (Math.max(A, B) + 0.05) / (Math.min(A, B) + 0.05); };
    const textOn = (bg) => (ratio(bg, '#FFFFFF') >= ratio(bg, '#1F2A2E') ? '#FFFFFF' : '#1F2A2E');
    const [h, s, l] = toHsl(hex);
    const set = (v) => this.setState({ colors: Object.assign({}, st.colors || {}, { [sel]: v }), draft: null });
    const isFill = sel === 'header' || sel === 'primaryBtn' || sel === 'accentBtn';
    const against = isFill ? textOn(hex) : (sel === 'money' || sel === 'nav' ? (sel === 'money' ? c.cards : '#FFFFFF') : '#1F2A2E');
    const r = ratio(hex, against);
    const good = r >= 4.5;
    return {
      c: c,
      hex: hex,
      hexInput: st.draft ?? hex,
      h: h, s: s, l: l,
      satFrom: fromHsl(h, 0, l), satTo: fromHsl(h, 100, l), ligMid: fromHsl(h, s, 50),
      headerText: textOn(c.header), primaryText: textOn(c.primaryBtn), accentText: textOn(c.accentBtn),
      selLabel: LABELS.find((x) => x[0] === sel)[1],
      elements: LABELS.map(([id, label]) => ({
        label: label, color: c[id], on: id === sel,
        border: id === sel ? '2px solid #1F2A2E' : '1px solid #E4DDCD',
        pick: () => this.setState({ sel: id, draft: null })
      })),
      onHex: (e) => {
        const v = e.target.value.trim();
        const norm = (v.startsWith('#') ? v : '#' + v).toUpperCase();
        if (/^#[0-9A-F]{6}$/.test(norm)) set(norm); else this.setState({ draft: v });
      },
      onH: (e) => set(fromHsl(Number(e.target.value), s, l)),
      onS: (e) => set(fromHsl(h, Number(e.target.value), l)),
      onL: (e) => set(fromHsl(h, s, Number(e.target.value))),
      contrastDot: good ? '#3E9D6B' : (r >= 3 ? '#F2B33D' : '#D64545'),
      contrastText: isFill
        ? 'Texto ' + (against === '#FFFFFF' ? 'branco' : 'escuro') + ' escolhido sozinho · contraste ' + r.toFixed(1) + ':1' + (good ? ' · ótimo' : ' · fraco')
        : 'Contraste com o texto ' + r.toFixed(1) + ':1' + (good ? ' · fácil de ler' : (r >= 3 ? ' · ok para títulos' : ' · difícil de ler')),
      resetAll: () => this.setState({ colors: {}, draft: null })
    };
  }
}
</script>
</body>
</html>
