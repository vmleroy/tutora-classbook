<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ListRow — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
  .p { padding: 16px 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .col { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 390px; }

<body>
<div id="root"></div>
<script>
  var T = window.Tutora, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' }, h(T.ListGroup, { title: 'Aulas e cobrança' }, h(T.ListRow, { icon: 'no-show', iconTone: 'danger', title: 'Cancelamentos e faltas', subtitle: 'Cobra 50% se cancelar com menos de 24h' }), h(T.ListRow, { title: 'Cronômetro ao vivo', subtitle: 'Desligado: aulas marcadas ou registradas à mão', trailing: 'switch', switchValue: true }), h(T.ListRow, { title: 'Lembretes', subtitle: '15 min antes da aula', trailing: 'switch', switchValue: false }))));
</script>
