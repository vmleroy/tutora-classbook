<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ProgressBar — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
  .p { padding: 16px 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .col { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 390px; }
  .phone { max-width: 390px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Tutora, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' }, h(T.ProgressBar, { value: 0.63, label: 'Ganho do dia' }), h(T.ProgressBar, { value: 0.8, tone: 'success', track: 'danger', label: 'Recebido' }), h(T.ProgressBar, { value: 0.45, tone: 'primary', track: 'sunken', thin: true, label: 'Parte do total' })));
</script>
</body>
</html>
