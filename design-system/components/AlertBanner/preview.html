<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AlertBanner — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
  .p { padding: 16px 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .col { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 390px; }
  .phone { max-width: 390px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Tutora, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' }, h(T.AlertBanner, { message: '3 alunos com pagamento pendente', value: 'R$ 560' }), h(T.AlertBanner, { tone: 'accent', icon: 'clock', message: 'Pacote da Ana termina na próxima aula' }), h(T.AlertBanner, { tone: 'secondary', icon: 'cloud', message: 'Sem backup há 15 dias' })));
</script>
</body>
</html>
