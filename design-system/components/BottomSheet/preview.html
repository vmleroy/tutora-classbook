<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BottomSheet — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
  .p { padding: 16px 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .col { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 390px; }
  .phone { max-width: 390px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Tutora, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'phone', style: { height: 320 } }, h(T.BottomSheet, { title: 'Relatório de ganhos', subtitle: 'Outubro 2026 · Tudo · usa os filtros da tela', actions: [h(T.Button, { key: 'c', variant: 'outline' }, 'Cancelar'), h(T.Button, { key: 'g' }, 'Gerar PDF')] }, h(T.Checkbox, { label: 'Ganhos por aluno e por local', checked: true }), h(T.Checkbox, { label: 'Lista de aulas', checked: true }))));
</script>
</body>
</html>
