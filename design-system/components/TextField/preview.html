<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TextField — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
  .p { padding: 16px 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .col { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 390px; }
  .phone { max-width: 390px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Tutora, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' }, h(T.TextField, { label: 'Nome do aluno', placeholder: 'Ex.: Ana Souza' }), h(T.TextField, { label: 'Preço por hora', value: 'R$ 120,00', helper: 'Usado quando o aluno não tem preço próprio' }), h(T.TextField, { label: 'Telefone', value: '11 9', error: 'Número incompleto: faltam 8 dígitos' })));
</script>
</body>
</html>
