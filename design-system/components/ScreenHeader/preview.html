<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ScreenHeader — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
  .p { padding: 16px 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .col { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 390px; }
  .phone { max-width: 390px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Tutora, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'phone' }, h(T.ScreenHeader, { variant: 'hero', eyebrow: 'Segunda, 26 de outubro', title: 'Boa tarde, Victor', actions: [{ icon: 'gear', label: 'Ajustes' }, { icon: 'plus', label: 'Nova aula', variant: 'accent' }] }), h(T.ScreenHeader, { variant: 'tab', title: 'Ganhos', action: h(T.Button, { size: 'sm', icon: 'file' }, 'Relatório') }), h(T.ScreenHeader, { variant: 'modal', title: 'Registrar aula', onBack: function () {} })));
</script>
</body>
</html>
